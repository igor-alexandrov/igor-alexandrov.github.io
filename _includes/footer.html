<footer class="mt-20 lg:mt-20">
  <div class="mx-auto max-w-6xl px-6 lg:px-8">
    <div
      class="border-ruby-600 border-t-2 py-6 md:flex md:items-center md:justify-between md:py-12"
    >
      <div class="social-links">
        {% if site.twitter %}
        <a
          href="https://twitter.com/{{ site.twitter.username }}"
          class="social-links__item"
          target="_blank"
          rel="noopener"
        >
          <span class="sr-only">X</span>
          <i data-lucide="twitter"></i>
        </a>
        {% endif %} {% if site.github %}
        <a
          href="https://github.com/{{ site.github }}"
          class="social-links__item"
          target="_blank"
          rel="noopener"
        >
          <span class="sr-only">GitHub</span>
          <i data-lucide="github"></i>
        </a>
        {% endif %} {% if site.youtube %}
        <a
          href="https://youtube.com/{{ site.youtube }}"
          class="social-links__item"
          target="_blank"
          rel="noopener"
        >
          <span class="sr-only">YouTube</span>
          <i data-lucide="youtube"></i>
        </a>
        {% endif %} {% if site.linkedin %}
        <a
          href="https://www.linkedin.com/in/{{ site.linkedin }}"
          class="social-links__item"
          target="_blank"
          rel="noopener"
        >
          <span class="sr-only">LinkedIn</span>
          <i data-lucide="linkedin"></i>
        </a>
        {% endif %}
      </div>

      <div
        class="mt-8 flex flex-col justify-between gap-y-4 md:order-1 md:mt-0 md:flex-row md:items-center md:gap-x-8"
      >
        <p class="text-center text-xs leading-5 uppercase">
          <a href="#">{{ site.title }}</a> &copy; {{ site.time | date: '%Y' }}
        </p>
        <p class="text-center text-xs leading-5 uppercase">
          Powered by <a target="_blank" href="https://jekyllrb.com/">Jekyll</a>.
        </p>
        <div class="flex justify-center">
          <a href="https://www.simpleanalytics.com?utm_source=igor.works&utm_content=badge" referrerpolicy="origin" target="_blank">
            <img
              src="https://simpleanalyticsbadges.com/igor.works?background=edf3f4&text=677779&logo=ff4f64&border=677779&radius=10&border-width=1&counter=false"
              width="168"
              height="40"
              alt="Simple Analytics"
              loading="lazy"
              referrerpolicy="no-referrer"
              crossorigin="anonymous"
            />
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
